name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        working-directory: apps/web-extractor
      - run: python -m unittest discover -v
        working-directory: apps/youtube-extractor

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-extractor/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-extractor/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
